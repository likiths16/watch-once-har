spring.application.name=watch-once-har
server.port=${PORT:4000}

spring.datasource.url=jdbc:sqlite:${DB_PATH:./watch-once-har.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows only one writer at a time; a bigger pool just trades one clear error
# (a busy connection waits) for confusing "database is locked" failures under load.
spring.datasource.hikari.maximum-pool-size=1
spring.sql.init.mode=always

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

logging.level.com.watchonce=INFO
